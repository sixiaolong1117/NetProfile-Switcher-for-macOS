name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

env:
  PROJECT: NetworkSelectorForMacOS.xcodeproj
  SCHEME: NetworkSelectorForMacOS
  CONFIGURATION: Release
  APP_NAME: NetProfile Switcher

jobs:
  test:
    name: Test
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            SYMROOT="$RUNNER_TEMP/BuildProducts" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Create DMG
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          APP_PATH="$RUNNER_TEMP/BuildProducts/$CONFIGURATION/$APP_NAME.app"
          STAGING_DIR="$RUNNER_TEMP/dmg"
          DMG_PATH="$RUNNER_TEMP/$APP_NAME-$SAFE_REF_NAME-$SHORT_SHA.dmg"

          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/$APP_NAME.app"
          ln -sfn /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=network-selector-macos-$SAFE_REF_NAME-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DMG_PATH }}

  release:
    name: Build Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Sync version from tag and commit
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [ -z "$VERSION" ]; then
            echo "Could not derive version from tag: $TAG_NAME"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag must be a version like 1.2.3 or v1.2.3. Got: $TAG_NAME"
            exit 1
          fi

          git fetch origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"

          TARGET_BRANCH="$(git branch -r --contains "$TAG_COMMIT" \
            | sed 's/^[ *]*//' \
            | grep -v '^origin/HEAD$' \
            | grep -x "origin/$DEFAULT_BRANCH" \
            | head -n 1)"

          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="$(git branch -r --contains "$TAG_COMMIT" \
              | sed 's/^[ *]*//' \
              | grep -v '^origin/HEAD$' \
              | head -n 1)"
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            echo "Could not find a remote branch containing tag commit $TAG_COMMIT"
            exit 1
          fi

          BRANCH_NAME="${TARGET_BRANCH#origin/}"
          git checkout -B "$BRANCH_NAME" "$TAG_COMMIT"

          CURRENT_VERSION="$(xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            2>/dev/null | awk -F'= ' '/ MARKETING_VERSION = / { print $2; exit }')"

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Updating MARKETING_VERSION from ${CURRENT_VERSION:-unknown} to $VERSION"
            VERSION="$VERSION" perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $ENV{VERSION};/g' "$PROJECT/project.pbxproj"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PROJECT/project.pbxproj"
            git commit -m "chore: release $TAG_NAME [skip ci]"
            git push origin "HEAD:$BRANCH_NAME"

            git tag -f "$TAG_NAME" HEAD
            git push origin "refs/tags/$TAG_NAME" --force
          else
            echo "MARKETING_VERSION already matches tag: $VERSION"
          fi

      - name: Build for test
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SYMROOT="$RUNNER_TEMP/BuildProducts" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Create DMG
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_PATH="$RUNNER_TEMP/BuildProducts/$CONFIGURATION/$APP_NAME.app"
          STAGING_DIR="$RUNNER_TEMP/dmg"
          DMG_PATH="$RUNNER_TEMP/$APP_NAME-$TAG_NAME.dmg"

          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/$APP_NAME.app"
          ln -sfn /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
