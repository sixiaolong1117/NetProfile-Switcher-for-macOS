name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

env:
  PROJECT: NetworkSelectorForMacOS.xcodeproj
  SCHEME: NetworkSelectorForMacOS
  CONFIGURATION: Release
  APP_NAME: Network Selector

jobs:
  test:
    name: Test
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

  release:
    name: Build Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SYMROOT="$RUNNER_TEMP/BuildProducts" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Create DMG
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_PATH="$RUNNER_TEMP/BuildProducts/$CONFIGURATION/$APP_NAME.app"
          STAGING_DIR="$RUNNER_TEMP/dmg"
          DMG_PATH="$RUNNER_TEMP/$APP_NAME-$TAG_NAME.dmg"

          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/$APP_NAME.app"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
