name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

env:
  PROJECT: NetworkSelectorForMacOS.xcodeproj
  SCHEME: NetworkSelectorForMacOS
  CONFIGURATION: Release
  APP_NAME: Network Selector

jobs:
  test:
    name: Test
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

  release:
    name: Build Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Sync version from tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          CURRENT_VERSION="$(xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            2>/dev/null | awk -F'= ' '/ MARKETING_VERSION = / { print $2; exit }')"

          if [ -z "$VERSION" ]; then
            echo "Could not derive version from tag: $TAG_NAME"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag must be a version like 1.2.3 or v1.2.3. Got: $TAG_NAME"
            exit 1
          fi

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Updating MARKETING_VERSION from ${CURRENT_VERSION:-unknown} to $VERSION"
            VERSION="$VERSION" perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $ENV{VERSION};/g' "$PROJECT/project.pbxproj"
          else
            echo "MARKETING_VERSION already matches tag: $VERSION"
          fi

      - name: Build for test
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SYMROOT="$RUNNER_TEMP/BuildProducts" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Create DMG
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_PATH="$RUNNER_TEMP/BuildProducts/$CONFIGURATION/$APP_NAME.app"
          STAGING_DIR="$RUNNER_TEMP/dmg"
          DMG_PATH="$RUNNER_TEMP/$APP_NAME-$TAG_NAME.dmg"

          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/$APP_NAME.app"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
